<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consolidated Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="tree-autolayout">

  <!-- Header: Show on all devices -->
  <header class="header">
    <div class="text-wrapper">Your Site Title</div>
    <!-- Contact in top-right (example) -->
    <nav class="contact">
      <button>Contact</button>
      <a href="https://instagram.com" aria-label="Instagram">IG</a>
      <a href="https://linkedin.com" aria-label="LinkedIn">IN</a>
    </nav>
    <div class="scroll-indicator">▼</div>
  </header>

  <!-- Mobile-only content -->
  <section class="mobile-only">
    <!-- Paste your entire mobile HTML content here -->
    <!-- Example: -->
    <div class="mobile-content">
      <!-- ... -->
    </div>
  </section>

  <!-- Tablet-only content -->
  <section class="tablet-only">
    <!-- Paste your entire tablet HTML content here -->
    <div class="tablet-content">
      <!-- ... -->
    </div>
  </section>

  <!-- Desktop-only content -->
  <section class="desktop-only">
    <!-- Paste your entire desktop HTML content here -->
    <div class="desktop-content">
      <!-- ... -->
    </div>
  </section>

</body>
</html>
